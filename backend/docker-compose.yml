version: '3.8'

services:
  # FastAPI Web Server Application
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://hadar_admin:my_secret_password@db:5432/fridge_inventory
    depends_on:
      db:
        condition: service_healthy
    command: bash -c "python init_db.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  # PostgreSQL Relational Database Service
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=hadar_admin
      - POSTGRES_PASSWORD=my_secret_password
      - POSTGRES_DB=fridge_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hadar_admin -d fridge_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: